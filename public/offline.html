<!doctype html>
<!--
  Shown by the service worker (`/sw.js`) for a page that was never opened
  while there is no connection. Plain HTML, no fonts or scripts from the
  network: it has to work with nothing but what the worker saved. Colours are
  the light and dark tokens from `app/app.css`.
-->
<html lang="en-KE">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1b1e25"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="robots" content="noindex" />
    <title>You're offline · DriveRush</title>
    <link rel="icon" href="/favicon-32x32.png" />
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f2ede3;
        --surface: #ffffff;
        --ink: #0e1014;
        --ink-2: #2a2d33;
        --rush: #e11d2e;
        --line: rgba(14, 16, 20, 0.25);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #14161b;
          --surface: #1b1e25;
          --ink: #f4efe2;
          --ink-2: #d6d1c4;
          --rush: #ff3d4f;
          --line: rgba(244, 239, 226, 0.25);
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 20px
          max(24px, env(safe-area-inset-bottom));
        background: var(--paper);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 26rem;
        display: grid;
        gap: 16px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }
      /* On white in both themes: the logo's D is near-black. */
      img {
        width: 56px;
        height: 56px;
        padding: 4px;
        border-radius: 12px;
        background: #ffffff;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }
      p {
        margin: 0;
        font-size: 16px;
        line-height: 1.45;
        color: var(--ink-2);
      }
      .actions {
        display: grid;
        gap: 8px;
        margin-top: 4px;
      }
      a,
      button {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 6px;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
        touch-action: manipulation;
      }
      a {
        background: var(--rush);
        color: #ffffff;
      }
      button {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      a:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/android-chrome-192x192.png" alt="DriveRush" />
      <h1>You're offline</h1>
      <p>
        This page needs a connection. The Board still works, and so does every
        page you've opened before.
      </p>
      <div class="actions">
        <a href="/model-town-board">Go to the Board</a>
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
  </body>
</html>
