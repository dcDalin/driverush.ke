<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f6f3ee;font-family:Inter,Arial,sans-serif;color:#1d1b19">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:14px;padding:28px">
      <tr>
        <td>
          <p style="margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#d7263d">DriveRush</p>
          <h1 style="margin:0 0 14px;font-size:22px">Your sign-in code</h1>
          <p style="margin:0 0 18px;font-size:15px;line-height:1.5">Type this code in DriveRush to save your progress:</p>
          <p style="margin:0 0 18px;font-size:34px;font-weight:700;letter-spacing:.3em;font-family:'JetBrains Mono',Menlo,monospace">{{ .Token }}</p>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#6b6560">It works for one hour. If you did not ask for it, you can ignore this email.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
