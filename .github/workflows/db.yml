# The database contract: the declarative schemas, their migrations, the
# generated types and every pgTAP and Vitest database test must agree.
name: Database

on:
  pull_request:
    paths:
      - "supabase/**"
      - "app/lib/supabase/**"
      - "test/db/**"
      - "vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/db.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "app/lib/supabase/**"
      - "test/db/**"
  workflow_dispatch:

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start the local Supabase stack
        run: npx supabase start

      - name: pgTAP (security manifest, guards, row level security, behaviour)
        run: npm run test:pgtap

      - name: Every schema change has a migration (db diff is empty)
        run: |
          out="$(npx supabase db diff 2>&1)"
          echo "$out" | tail -20
          echo "$out" | grep -q "No schema changes found"

      - name: Generated types are up to date
        run: npm run db:types:check

      - name: Vitest database suite (real auth and API)
        run: npx vitest run --project db

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Stop the stack
        if: always()
        run: npx supabase stop --no-backup
